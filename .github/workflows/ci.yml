# Backend test suite on every pull request, on main, and before every release
# (release.yml calls it). The backend pass hides GTK; native Google integration
# tests then run with GTK and Xvfb in the same required check. No secrets,
# read-only token, GitHub-owned actions pinned by commit.
name: CI
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # Pinned: a newer default rule set failed the first public run with 911
      # findings the project never adopted.
      - run: pip install -q pytest ruff==0.15.20
      - run: ruff check .
      - name: pytest (GTK hidden)
        run: |
          mkdir -p "$HOME/nogtk"
          # pytest >= 8.2 importorskip-skips only on ModuleNotFoundError; a plain
          # ImportError is a collection error.
          printf 'raise ModuleNotFoundError("gtk hidden in CI")\n' > "$HOME/nogtk/gi.py"
          PYTHONPATH="$HOME/nogtk" python3 -m pytest -q -p no:cacheprovider
      - name: Install native Google test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-pytest python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-gtksource-5 xvfb xauth
      - name: Google driver and window accounting (native GTK)
        env:
          GSK_RENDERER: cairo
        run: |
          xvfb-run -a /usr/bin/python3 -m pytest -q -p no:cacheprovider \
            tests/test_google_env.py tests/test_gemini_driver.py \
            tests/test_execution_settings_window.py tests/test_driver_signal_contract.py \
            tests/test_checkpoint_dispatch_window.py
