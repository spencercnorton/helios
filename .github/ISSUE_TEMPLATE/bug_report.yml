name: Bug report
description: Something in Helios does not behave as documented.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove anything private from logs and transcripts before pasting them: project paths, hostnames, API keys, conversation content.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
      placeholder: Opened a session from the sidebar, expected the transcript, got an empty pane.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch `./scripts/helios`
        2. …
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: ["Claude (claude CLI)", "GPT (Codex App Server)", "OpenRouter", "Not provider-specific"]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Helios version (Settings → About or `pyproject.toml`), `claude --version` / `codex --version`, distro, GTK and libadwaita versions.
      placeholder: Helios 0.96.3 · claude 2.1.x · Ubuntu 24.04 · GTK 4.14 · libadwaita 1.5
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log excerpt
      description: Run with `HELIOS_DEBUG=1 ./scripts/helios` and paste the relevant lines, scrubbed.
      render: text
