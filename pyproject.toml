[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helios"
version = "0.97.1"
description = "Native Ubuntu AI workbench for Claude Code and OpenAI Codex"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Spencer Norton" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
]
dependencies = [
    # PyGObject, gir1.2-gtk-4.0, gir1.2-adw-1 come from apt — do not pip-install
]

[project.optional-dependencies]
# Dev/test only. Install with `apt install python3-pytest` (Ubuntu) or
# `pip install -e .[test]`. The runtime needs none of these.
test = ["pytest"]

[project.scripts]
helios = "helios.__main__:main"

[project.urls]
Homepage = "https://github.com/spencercnorton/helios"
Repository = "https://github.com/spencercnorton/helios"
Issues = "https://github.com/spencercnorton/helios/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Default rules (pyflakes F + pycodestyle E4/E7/E9). E402 is ignored because
# PyGObject requires gi.require_version(...) to run *before* the matching
# `from gi.repository import ...`, which is import-not-at-top by definition.
ignore = ["E402"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
helios = ["resources/icons/*.svg", "resources/style/*.css", "resources/ui/*.ui"]
