name: Feature request
description: Propose a change to how Helios works.
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Helios makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change, and what should it look like in the UI?
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: ["Claude (claude CLI)", "GPT (Codex App Server)", "OpenRouter", "All providers", "Not provider-specific"]
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
